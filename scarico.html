<title>Lo Scarico</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Permanent+Marker&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Il minigioco dello scarico (docs/minigioco-scarico.md). Si apre da solo
     nel browser oppure dentro il gioco (index.html lo carica in un iframe
     con ?embed=1 e riceve il risultato con postMessage).
     Stessi colori e caratteri del gioco: solo tema scuro, come il gioco. */
  :root{
    color-scheme: dark;
    --bg-deck:#141519; --bg-panel:#1c1d22; --bg-raised:#24252b; --hairline:#34363e;
    --text:#eee9df; --muted:#8b8e98; --amber:#f2a541; --green:#49b06a; --red:#e0503f; --yellow:#f2c53d;
    --paper:#f4f1ea; --ink:#141519;
    --t-palco:#eaff2b; --t-back:#ff4fb4; --t-pit:#4fb7ff; --t-foh:#49e07a;
    --display:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --ui:'Inter', system-ui, sans-serif;
    --marker:'Permanent Marker', 'Comic Sans MS', cursive;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg-deck);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* --deck: la fascia in basso fuori dalla scena (barra d'aiuto e barra
     degli ordini): la scena non ci finisce sotto */
  #app{position:relative;height:100%;overflow:hidden;--pad-h:calc(58px + env(safe-area-inset-bottom,0px));--deck:calc(46px + var(--pad-h))}
  @media (max-width:640px){ #app{--pad-h:calc(104px + env(safe-area-inset-bottom,0px))} }
  #cv{position:absolute;left:0;right:0;top:0;bottom:var(--deck);width:100%;height:calc(100% - var(--deck));display:block}

  /* ---- testata ---- */
  .hud{position:absolute;left:0;right:0;top:0;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(rgba(20,21,25,.92),rgba(20,21,25,.72));border-bottom:1px solid var(--hairline);z-index:3}
  .hud-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
  .tag{font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--amber);white-space:nowrap}
  .clock{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:260px}
  .clock b{font-family:var(--display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
  .tbar{flex:1;height:8px;background:var(--bg-raised);border-radius:4px;overflow:hidden;min-width:40px}
  .tbar i{display:block;height:100%;width:0;background:var(--amber)}
  .tbar.late i{background:var(--red)}
  .hud-r{display:flex;align-items:center;gap:10px}
  .stat{display:grid;line-height:1.1;text-align:right}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
  .chip{border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat.eff{min-width:76px}
  .effbar{height:6px;background:var(--bg-raised);border-radius:3px;overflow:hidden;margin:2px 0 1px}
  .effbar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s,background .4s}
  .stat.done b{color:var(--green)}
  .stat.cart b{color:#cfdbe8}
  .stat.cart.done b{color:var(--green)}
  .clock.late b{color:var(--red)}
  .reveal{animation:fresh .8s ease-out}
  .icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--hairline);background:var(--bg-raised);font-size:13px;font-weight:700;flex:none}
  .end-btn{border:1px solid var(--green);background:#1d3324;color:#bff0cd;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;white-space:nowrap}

  /* barra d'aiuto: avvisi e obiettivo, in basso fuori dalla scena, con la X */
  #hintbar{position:absolute;left:0;right:0;bottom:var(--pad-h);height:46px;z-index:3;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;background:var(--bg-panel);border-top:1px solid var(--hairline)}
  #hint{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.25;color:var(--muted);border-left:4px solid transparent;padding-left:8px;transition:color .2s,border-color .2s}
  #hint span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #hint.msg{color:var(--text);border-left-color:var(--hairline)}
  #hint.ok{border-left-color:var(--green)}#hint.bad{border-left-color:var(--red)}#hint.warn{border-left-color:var(--amber)}
  #hint-x{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--hairline);background:var(--bg-raised);color:var(--muted);font-size:14px;line-height:1}
  #hint-x[hidden]{display:none}
  @media (max-width:520px){ #hint{font-size:13px} }

  /* ---- la barra degli ordini: chi, cosa, dove ---- */
  #cmd{position:absolute;left:0;right:0;bottom:0;height:var(--pad-h);z-index:3;display:flex;align-items:center;gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg-deck);border-top:1px solid var(--hairline)}
  #cmd-who,#cmd-act{display:flex;align-items:center;gap:6px;min-width:0}
  #cmd-act{flex:1;overflow-x:auto;scrollbar-width:none}
  #cmd-act::-webkit-scrollbar{display:none}
  #cmd button{height:40px;border-radius:8px;border:1px solid var(--hairline);background:var(--bg-raised);font-family:var(--display);font-size:15px;letter-spacing:.04em;padding:0 10px;white-space:nowrap;flex:none;touch-action:manipulation}
  #cmd .who{display:grid;grid-template-columns:auto auto;align-items:center;column-gap:6px;text-align:left;line-height:1.05;min-width:92px}
  #cmd .who i{grid-row:1/3;width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
  #cmd .who span{font-family:var(--ui);font-size:10px;color:var(--muted);letter-spacing:0;max-width:96px;overflow:hidden;text-overflow:ellipsis}
  #cmd .who.on{border-color:var(--amber);background:#33291a}
  #cmd .who.on b{color:var(--amber)}
  #cmd .sel{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:16px;letter-spacing:.04em;color:var(--text);padding:0 4px 0 8px;border-left:4px solid var(--amber);white-space:nowrap;flex:none}
  #cmd .zone i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  #cmd .zone.best{border-color:currentColor;color:var(--text);font-size:16px}
  #cmd .zone.best b{color:var(--green);margin-left:4px}
  #cmd .tog.on{background:#25313d;border-color:#8fa3b8;color:#dfe8f2}
  #cmd .van{border-color:var(--amber);color:var(--ink);background:var(--amber)}
  #cmd .x{width:40px;padding:0;color:var(--muted)}
  #cmd .note{font-size:13px;color:var(--muted);white-space:nowrap}
  #cmd-how{display:flex;gap:6px;min-width:0}
  #cmd-how:empty{display:none}
  @media (max-width:640px){
    #cmd{flex-direction:column;align-items:stretch;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
    #cmd button{height:40px}
    /* sul telefono: in alto chi e come (carrello), sotto le zone tutte in vista */
    #cmd .who{min-width:0;flex:1 1 0;max-width:132px}
    #cmd-how{flex:none;margin-left:auto}
    #cmd-how button{padding:0 9px}
    #cmd .sel{border-left:0;padding:0}
    #cmd .sel .nm{display:none}
    #cmd-act{overflow:visible}
    #cmd-act .zone{flex:1 1 0;min-width:0;padding:0 3px;overflow:hidden;text-overflow:ellipsis;font-size:14px;letter-spacing:0}
    #cmd-act .zone.best{font-size:15px}
    #cmd-act .zone.best b{margin-left:2px}
    #cmd .x{width:34px}
    #cmd-act .zone i{display:none}
    #cmd-act .zone:not(.best){border-bottom:3px solid var(--zc)}
  }
  #keys{flex:none;font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:nowrap}
  @media (max-width:820px){ #keys{display:none} }
  kbd{font-family:var(--ui);font-size:11px;font-weight:700;color:var(--text);background:var(--bg-raised);border:1px solid var(--hairline);border-bottom-width:2px;border-radius:4px;padding:0 5px}

  /* ---- schermate ---- */
  .overlay{position:absolute;inset:0;z-index:5;background:rgba(10,10,12,.82);display:grid;place-items:center;padding:16px;overflow:auto}
  .card{background:var(--bg-panel);border:1px solid var(--hairline);border-radius:14px;padding:20px;max-width:520px;width:100%;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h1{font-family:var(--display);font-size:44px;line-height:.95;margin:0;letter-spacing:.02em;text-wrap:balance}
  .card h1 small{display:block;font-family:var(--ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;font-weight:700}
  .card p{margin:0;line-height:1.5;color:var(--text);font-size:15px}
  .card ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.45;color:#d6d2c9}
  .zones{display:flex;flex-wrap:wrap;gap:6px}
  .zchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border:1px solid var(--hairline);border-radius:999px;padding:3px 10px 3px 6px;background:var(--bg-raised)}
  .zchip i{width:18px;height:8px;border-radius:2px;display:block}
  .primary{background:var(--amber);color:var(--ink);border:0;border-radius:10px;padding:14px;font-family:var(--display);font-size:22px;letter-spacing:.06em}
  .secondary{background:var(--bg-raised);border:1px solid var(--hairline);border-radius:10px;padding:12px;font-weight:600}
  .legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}

  /* bolla di scarico: il foglio di carta del service */
  .bolla{background:var(--paper);color:var(--ink);border-radius:6px;max-width:640px;width:100%;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .bolla header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;flex-wrap:wrap}
  .bolla h2{font-family:var(--display);font-size:34px;margin:0;line-height:1}
  .bolla header small{font-size:12px;color:#5b5750;display:block;margin-top:2px}
  .stamp{font-family:var(--marker);font-size:20px;border:3px solid currentColor;border-radius:6px;padding:2px 10px;transform:rotate(-4deg);white-space:nowrap}
  .stamp.ok{color:#1f7a3f}.stamp.late{color:#b3321f}
  .sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .sum div{border:1px solid #cfc9bc;border-radius:6px;padding:8px}
  .sum span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b665d}
  .sum b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
  .tw{overflow-x:auto}
  .bolla table{border-collapse:collapse;width:100%;font:inherit;font-size:13px;color:var(--ink);min-width:480px}
  .bolla th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b665d;border-bottom:1px solid #cfc9bc;padding:4px 6px}
  .bolla td{border-bottom:1px solid #e2ddd2;padding:6px;vertical-align:top;line-height:1.35}
  .bolla td small{color:#6b665d}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
  .p-integro{background:#d5ecd9;color:#1f5c31}.p-ammaccato{background:#ece6cf;color:#6a5712}
  .p-difettoso{background:#f6dcc0;color:#8a4a0f}.p-rotto{background:#f3cdc6;color:#8f2616}
  .zdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
  .montaggio{background:#ebe6db;border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.5}
  .montaggio b{font-family:var(--display);font-size:16px;letter-spacing:.04em}
  .bolla .note{font-size:12px;color:#6b665d;margin:0}
  .bolla .row{display:flex;gap:8px;flex-wrap:wrap}
  .bolla .primary{flex:1}
  .lavoro{display:grid;gap:4px;font-size:14px;line-height:1.4;margin:0;padding:0;list-style:none}
  .lavoro li{display:flex;gap:8px}
  .lavoro li b{flex:none;width:18px;text-align:center}
  .lavoro .ok b{color:#1f7a3f}.lavoro .no b{color:#b3321f}
  .riep{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;background:#ebe6db;border-radius:6px;padding:10px 12px;font-size:14px}
  .riep h3{grid-column:1/-1;margin:0 0 4px;font-family:var(--display);font-size:20px;letter-spacing:.04em}
  .riep div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #cfc8b8}
  .riep span{color:#6b665d}
  .riep .stelle{grid-column:1/-1;border:0;font-size:16px}.riep .stelle b{color:#c79a12;font-size:20px;letter-spacing:2px}
  @media (max-width:520px){.riep{grid-template-columns:1fr}}
  .start-quote{font-family:var(--marker);font-size:22px;line-height:1.3;color:var(--paper)}
  .start-quote small{display:block;font-family:var(--ui);font-size:13px;color:var(--muted);margin-top:4px}
  @media (max-width:520px){
    .tag{display:none}
    .stat.eff{min-width:52px}
    .hud{padding:8px 10px;gap:8px}
    .hud-r{gap:9px}
    .clock{flex:none}
    .clock .tbar{display:none}
    .stat span{font-size:9px;letter-spacing:.04em}
    .stat b{font-size:18px}
    .chip{font-size:11px;padding:2px 6px}
    .clock b{font-size:22px}
    .card h1{font-size:36px}
  }
  @media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <header class="hud">
    <div class="hud-l">
      <span class="tag">SCARICO · FESTA DELLA SCUOLA</span>
      <div class="clock"><b id="clock">16:00</b><div class="tbar" id="tbar"><i id="tfill"></i></div></div>
    </div>
    <div class="hud-r">
      <span class="chip" id="h-coffee" hidden>CAFFÈ 45</span>
      <div class="stat cart" id="h-cart" hidden><span>Carrello</span><b id="h-cart-n">0/3</b></div>
      <button class="end-btn" id="btn-close" hidden>Chiudi lo scarico</button>
      <div class="stat" id="h-del-w"><span>Scaricato</span><b id="h-del">0/11</b></div>
      <div class="stat" id="h-dmg-w" hidden><span>Danni</span><b id="h-dmg">0</b></div>
      <div class="stat eff" id="h-eff-w" hidden><span>Lavoro</span><div class="effbar"><i id="h-eff-fill"></i></div><b id="h-eff">Ottimo</b></div>
      <button class="icon-btn" id="btn-pause" title="Pausa" aria-label="Pausa">❚❚</button>
    </div>
  </header>

  <div id="hintbar">
    <div id="hint"><span id="hint-txt"></span></div>
    <button id="hint-x" aria-label="Chiudi l'avviso" title="Chiudi">✕</button>
    <div id="keys" hidden>
      <span><kbd>1</kbd> <kbd>2</kbd> Tu / Macio</span>
      <span><kbd>C</kbd> carrello</span>
      <span><kbd>Esc</kbd> annulla</span>
    </div>
  </div>

  <div id="cmd" hidden>
    <div id="cmd-who">
      <button class="who" data-w="0"><i></i><b>TU</b><span>libero</span></button>
      <button class="who" data-w="1"><i></i><b>MACIO</b><span>libero</span></button>
      <div id="cmd-how"></div>
    </div>
    <div id="cmd-act"></div>
  </div>


  <div class="overlay" id="start">
    <div class="card">
      <h1><small>I.C. Galilei · cortile della palestra</small>FESTA DELLA SCUOLA — 16:00</h1>
      <p class="start-quote">«Siamo arrivati. Portiamo giù il materiale.»<small>Macio, il collega</small></p>
      <div class="legend" id="start-legend"></div>
      <button class="primary" id="btn-start">Apri il portellone</button>
      <button class="secondary" id="btn-skip" hidden>Salta lo scarico: tutto arriva sano, ma niente birre</button>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="card">
      <h1><small>Pausa</small>Tutto fermo</h1>
      <button class="primary" id="btn-resume">Riprendi</button>
      <button class="secondary" id="btn-restart">Ricomincia lo scarico</button>
    </div>
  </div>

  <div class="overlay" id="end" hidden></div>
</div>

<script>
// dentro il gioco (index.html) lo scarico gira in un iframe con ?embed=1:
// il risultato torna al gioco con postMessage. Questo pezzo sta prima di
// Matter.js, così "Salta" funziona anche se la fisica non si carica.
const QS = new URLSearchParams(location.search);
const EMBED = QS.has('embed');
const SERVICE = (QS.get('service') || '').slice(0, 28);
// colori del marchio del service (livrea del furgone); solo #rgb/#rrggbb
const hexOr = (v, d) => /^#[0-9a-f]{3,6}$/i.test(v || '') ? v : d;
const LIVERY = { bg: hexOr(QS.get('bg'), '#1c1d22'), fg: hexOr(QS.get('fg'), '#f2a541') };
// volume (0-1) e «Effetti ridotti» delle impostazioni del gioco, dall'indirizzo dell'iframe
const VOL = QS.has('vol') && Number.isFinite(+QS.get('vol')) ? Math.max(0, Math.min(1, +QS.get('vol'))) : 1;
function sendResult (result) { try { parent.postMessage({ type: 'scarico-fine', result }, '*'); } catch (e) { /* niente genitore */ } }
// il primo scarico (first=1) non si salta: è il tutorial. Senza fisica sì
if (EMBED) {
  const skip = document.getElementById('btn-skip');
  skip.hidden = QS.has('first');
  skip.addEventListener('click', () => sendResult({ skipped: true }));
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
'use strict';
// senza rete Matter.js non arriva: si può solo saltare (vedi in fondo)
const { Engine, Bodies, Body, Composite, Collision, Bounds, Query } = window.Matter || {};

/* ---------------------------------------------------------------------
   COSTANTI — valori di partenza da tarare giocando (vedi il documento).
   Unità: 1 px del mondo ≈ 1 cm; velocità in px per passo (60 al secondo).
   --------------------------------------------------------------------- */
const STEP = 1000 / 60;
const GAME_SECONDS = 360;              // 16:00 → 16:30 in 6 minuti reali
const CAT = { WALL: 1, CASE: 2, WORKER: 4, STEP: 8, NPC: 16, TROLLEY: 64 };
const TROLLEY_MAX = 2;                 // sul carrello: un case sulla pala e, se è piccolo, uno sopra
/* Il furgone è un furgone da service (vano 2,1 × 2 m) già parcheggiato a
   coda verso la palestra: dalla fine della rampa alla porta ci sono meno di
   tre metri. Tu e Macio siete larghi una quarantina di centimetri. */
const DOOR_X = 780;                    // portellone del furgone
const VAN = { x1: DOOR_X - 212, x2: DOOR_X, y1: 400, y2: 600 };   // il vano di carico
const RAMP = { x: DOOR_X, y: 440, w: 110, h: 120 };
const GYM_X = 1160;                    // muro della palestra (porta con gradino)
const STEP_BAND = { y1: 420, y2: 580 };   // porta a due ante della palestra: 1,6 m
const WORLD = { x1: 290, y1: 60, x2: 1900, y2: 940 };
// il cortile fra furgone e palestra: albero, panchina, moka del bidello
const TREE = { x: 1075, y: 255 }, BENCH = { x: 845, y: 860 }, MOKA = { x: 1100, y: 167 };

/* La palestra è la stessa del montaggio, vista dall'alto: dalla porta del
   cortile si entra nel Backstage (allaccio e quadro), davanti c'è il palco
   già montato (con la scaletta: l'asta e il microfono vanno lì), sotto il palco l'Off Stage con la
   regia, poi il Pit davanti al palco, la platea e in fondo la FOH. I case si
   lasciano dove serviranno al montaggio. */
const STAGE = { x1: 1290, y1: 276, x2: 1490, y2: 564 };
const ZONES = {
  palco: { name: 'Palco', color: '#eaff2b', x: STAGE.x1 + 6, y: STAGE.y1 + 6, w: STAGE.x2 - STAGE.x1 - 12, h: STAGE.y2 - STAGE.y1 - 12 },
  back:  { name: 'Backstage', color: '#ff4fb4', x: 1170, y: 150, w: 115, h: 292 },
  foh:   { name: 'Off Stage · regia', color: '#49e07a', x: 1292, y: 574, w: 198, h: 272 },
  pit:   { name: 'Pit', color: '#4fb7ff', x: 1498, y: 160, w: 104, h: 686 }
};
// i flight case sono fatti per prendere colpi: si rovina qualcosa solo con
// un urto vero (correre contro un muro, far cadere, lanciare un case)
const FRAG = {
  bassa:     { thr: 4.6, mult: 0.5 },

const AU = {
  ctx: null, last: 0,
  init () {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return; }
    this.out = this.ctx.createGain(); this.out.gain.value = VOL; this.out.connect(this.ctx.destination);
  },
  noise (dur, freq, type, gain) {
    const c = this.ctx; if (!c) return;
    const n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = gain;
    s.connect(f); f.connect(g); g.connect(this.out); s.start();
  },
  tone (f1, f2, dur, gain, type) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f1, c.currentTime); o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + dur);
    g.gain.setValueAtTime(gain, c.currentTime); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(this.out); o.start(); o.stop(c.currentTime + dur);
  },
  thud (v) { const now = performance.now(); if (now - this.last < 70) return; this.last = now; this.noise(0.18, 180 + v * 60, 'lowpass', clamp(v / 5, 0.08, 0.6)); },
  crack () { this.noise(0.12, 2500, 'highpass', 0.35); this.tone(2400, 900, 0.1, 0.08, 'square'); },
  ding () { this.tone(880, 1320, 0.25, 0.12); },
  hey () { this.tone(330, 520, 0.18, 0.1, 'sawtooth'); },
  bad () { this.tone(300, 120, 0.3, 0.12, 'square'); },
  // prendere e posare: un fruscio di maniglia e un tonfo sordo, discreti
  pick () { this.noise(0.06, 1200, 'bandpass', 0.12); this.tone(180, 260, 0.09, 0.05); },
  drop () { this.noise(0.14, 160, 'lowpass', 0.22); },
  clack () { this.noise(0.05, 2200, 'bandpass', 0.18); this.tone(520, 380, 0.07, 0.05, 'square'); },
  locked () { this.noise(0.08, 400, 'lowpass', 0.25); this.tone(160, 140, 0.12, 0.06, 'square'); },
  good () { const c = this.ctx; if (!c) return; this.tone(660, 660, 0.12, 0.08); setTimeout(() => this.tone(990, 990, 0.18, 0.08), 110); },
  done () { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, f, 0.22, 0.08), i * 110)); }
};

/* Gli avvisi stanno nella barra d'aiuto in basso, fuori dalla scena, con
   la X per chiuderli. Quando non c'è un avviso la barra dice cosa fare. */
let toastTimer = 0, hintGoal = '', hintMsg = false, hintClosed = false, hintAt = 0, hintQueue = [], queueTimer = 0;
function toast (msg, kind, force) {
  // un avviso appena comparso resta almeno un attimo: il nuovo si mette in fila
  if (!force && hintMsg && performance.now() - hintAt < 2200 && $('#hint-txt').textContent !== msg) {
    if (!hintQueue.some(q => q[0] === msg)) hintQueue.push([msg, kind]);
    // in fila al massimo tre: se sono troppi si perde un consiglio, non un errore
    if (hintQueue.length > 3) { const i = hintQueue.findIndex(q => q[1] !== 'bad'); hintQueue.splice(i < 0 ? 0 : i, 1); }
    nextHint();
    return;
  }
  hintAt = performance.now();
  const el = $('#hint');
  $('#hint-txt').textContent = msg; el.className = 'msg ' + (kind || '');
  hintMsg = true; hintClosed = false; $('#hint-x').hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(clearHint, msg.length > 70 ? 6500 : 4500);
  if (hintQueue.length) nextHint();
}
function nextHint () {
  clearTimeout(queueTimer);
  queueTimer = setTimeout(() => { const q = hintQueue.shift(); if (q) toast(q[0], q[1], true); }, Math.max(0, 2200 - (performance.now() - hintAt)));
}
function clearHint () {
  clearTimeout(toastTimer); hintMsg = false;
  if (hintQueue.length) { const q = hintQueue.shift(); toast(q[0], q[1], true); return; }
  $('#hint').className = ''; $('#hint-txt').textContent = hintClosed ? '' : hintGoal;
  $('#hint-x').hidden = hintClosed || !hintGoal;
}
// l'obiettivo del momento (si vede quando non c'è un avviso)
function goal (txt) {
  if (txt === hintGoal) return;
  hintGoal = txt; hintClosed = false;
  if (!hintMsg) clearHint();
}
$('#hint-x').addEventListener('click', () => { if (!hintMsg) hintClosed = true; clearHint(); });
// un consiglio una volta sola, la prima volta che serve
function once (key, msg, kind) {
  if (!G || G.seen[key]) return false;
  G.seen[key] = true; if (msg) toast(msg, kind);
  return true;
}
// una cosa imparata (Macio in squadra, il carrello, la barra del lavoro)
function unlock (what) {
  if (!G || G.unlock[what]) return;
  G.unlock[what] = true;
}
// testo che sale e sparisce sopra un punto del mondo (feedback piccolo)
function floatText (x, y, text, color) { if (G) G.fx.push({ kind: 'text', x, y, text, color: color || '#eee9df', born: performance.now(), life: 1400 }); }
function bubble (ent, text, dur) {
  G.bubbles = G.bubbles.filter(b => b.ent !== ent);
  G.bubbles.push({ ent, text, until: G.t + (dur || 2.2) + (G.mode === 'intro' ? 2 : 0) });
}

function toLocal (b, p) { return rot(sub(p, b.position), -b.angle); }
// punto della superficie del case più vicino a p, e distanza (negativa se dentro)
function surface (ce, p) {
  const L = toLocal(ce.body, p), hw = ce.def.w / 2, hh = ce.def.h / 2;
  let cx = clamp(L.x, -hw, hw), cy = clamp(L.y, -hh, hh);
  const inside = Math.abs(L.x) < hw && Math.abs(L.y) < hh;
  if (inside) { if (hw - Math.abs(L.x) < hh - Math.abs(L.y)) cx = Math.sign(L.x || 1) * hw; else cy = Math.sign(L.y || 1) * hh; }
  const d = Math.hypot(L.x - cx, L.y - cy);
  return { local: { x: cx, y: cy }, dist: inside ? -d : d, world: add(ce.body.position, rot({ x: cx, y: cy }, ce.body.angle)) };
}
function carriable (ce) { return ce.def.wheel === 'hand'; }
// l'elettronica delicata la porti tu: Macio non la tocca
function delicate (ce) { return ce.def.id === 'valigetta' || ce.def.id === 'par'; }

/* Ordine di scarico: nel furgone esce prima quello caricato per ultimo.
   Un case è bloccato se, ancora nel furgone, ha davanti (verso il
   portellone) un altro case sulla sua stessa fascia. Si calcola dalle
   posizioni vere: spostato quello davanti, il case dietro si libera. */

  if (!inVan(ce)) return [];
  const a = ce.body.bounds, out = [];
  for (const o of G.cases) {
    if (o === ce || o.hidden || !inVan(o)) continue;
    const b = o.body.bounds;
    if (b.min.x < a.max.x - 6) continue;                          // non sta davanti
    const ov = Math.min(a.max.y, b.max.y) - Math.max(a.min.y, b.min.y);
    if (ov > 12) out.push(o);

}

  const f = ce.body.collisionFilter;
  if (ce.kind === 'trolley') {
    f.group = ce.grabbers.length ? -1 : 0;
    for (const c of ce.load) c.body.collisionFilter.group = f.group;
    return;
  }
  const held = ce.grabbers.length > 0 || ce.carrier || (ce.onTrolley && ce.onTrolley.grabbers.length);
  f.group = held ? -1 : 0;
  let mask = CAT.WALL | CAT.CASE | CAT.NPC | CAT.TROLLEY;
  if (!held) mask |= CAT.WORKER;
  const lifted = ce.carrier || G.t < ce.liftUntil;
  if (!lifted) mask |= CAT.STEP;
  f.mask = mask;
}

/* ---------------------------------------------------------------------
   IL FURGONE: portellone, rampa, cinghie e freni. Si arriva col furgone
   chiuso: APRI il portellone, giù la RAMPA, poi si sgancia la cinghia di
   uno strato e si toglie il freno ai case con le ruote. Un case legato o
   frenato non si muove (corpo fermo), e tiene bloccati quelli dietro.
   --------------------------------------------------------------------- */
function strapOn (ce) { return ce.strap >= 0 && G.straps[ce.strap]; }
function locked (ce) { return ce.kind === 'case' && (strapOn(ce) || !!ce.brake); }
function openDoors () {
  if (G.van.open || G.van.anim) return;
  G.van.anim = { what: 'doors', t: 0 }; AU.clack();
  bubble(G.player, 'Apro!', 0.8);
}
function lowerRamp () {
  if (!G.van.open || G.van.ramp || G.van.anim) return;
  G.van.anim = { what: 'ramp', t: 0 }; AU.thud(3);
  bubble(G.macio, 'Piano con la rampa…', 1.2);
}
// fine delle animazioni: portellone aperto, rampa giù
function vanStep (dt) {
  const A = G.van.anim; if (!A) return;
  A.t += dt;
  if (A.what === 'doors') {
    G.doorsOpen = clamp(A.t / 1.0, 0, 1);
    if (A.t >= 1) {
      G.van.open = true; G.van.anim = null;
      goal('Tira giù la rampa: TIRA GIÙ LA RAMPA, qui sotto.');
      once('legati', 'Dentro i case sono legati con le cinghie e i case con le ruote hanno il freno tirato, come per il viaggio.', 'ok');
    }
  } else if (A.what === 'ramp') {
    G.van.rampK = clamp(A.t / 0.8, 0, 1);
    if (A.t >= 0.8) {
      G.van.ramp = true; G.van.anim = null; AU.thud(5);
      Composite.remove(G.world, G.doorWall); G.statics = G.statics.filter(b => b !== G.doorWall);
      G.team = true; G.cartAt = G.t + 3.2;
      bubble(G.macio, 'Ti tiro fuori il carrello.', 2.4);
      goal('Il carico è legato: SGANCIA LA CINGHIA, qui sotto.');
    }

}
function releaseStrap (i) {
  if (!G.straps[i]) return;
  G.straps[i] = false; AU.tone(520, 300, 0.12, 0.08);
  const st = VAN_STRAPS[i];
  floatText(st.x, 400, 'CINGHIA SGANCIATA', '#f2a541');
  const braked = G.cases.filter(c => c.strap === i && c.brake && !c.hidden);
  once('freno', 'Cinghia sganciata. ' + (braked.length ? 'I case con le ruote hanno ancora il freno: lo toglie chi li va a prendere.' : ''), 'ok');
  goal('Scegli chi lavora (TU o MACIO), tocca un case e poi la zona dove va. Prima quelli davanti.');
}
function releaseBrake (ce) {
  if (!ce.brake) return;
  ce.brake = false; AU.tone(380, 260, 0.1, 0.08);
  floatText(ce.body.position.x, ce.body.position.y - 20, 'FRENO TOLTO', '#f2a541');
}
/* ---------------------------------------------------------------------
   PRENDERE, SPINGERE, PORTARE
   --------------------------------------------------------------------- */
function grab (w, ce) {
  if (ce.kind === 'case' && locked(ce)) {
    if (w === G.player) toast(ce.def.name + (strapOn(ce) ? ': è ancora legato con la cinghia.' : ': ha il freno tirato.'), 'warn');
    return false;
  }
  if (ce.kind === 'case' && blockers(ce).length) { if (w === G.player) blockedTry(ce); return false; }
  if (ce.carrier || ce.grabbers.length) return false;
  unpark(ce);
  // l'oggetto resta dov'è: chi lo prende si gira verso di lui e da adesso
  // lo tiene a quella distanza e con quell'angolo (vedi PRESA)
  const c = ce.body.position, p = w.body.position;
  w.facing = Math.atan2(c.y - p.y, c.x - p.x);
  w.hold = { off: { x: len(sub(c, p)), y: 0 }, rel: angDiff(ce.body.angle, w.facing) };
  w.grab = ce; w.vel = { x: 0, y: 0 };
  if (carriable(ce)) { w.mode = 'carry'; ce.carrier = w; }
  else { w.mode = 'push'; ce.grabbers.push(w); }
  if (w === G.player) { AU.pick(); if (w.mode === 'carry') puff(p.x, p.y, 4, 'rgba(190,190,196,', 0.8); }
  refreshFilter(ce);
  if (w === G.player && ce.kind === 'case') learnFrom(ce);
  return true;
}
// ACCESSO BLOCCATO: i case davanti lampeggiano, e basta
function blockedTry (ce) {
  const bl = blockers(ce);
  G.blockFlash = { ce, ids: bl, until: G.t + 1.8 };
  G.stats.blocked++; AU.locked();
  floatText(ce.body.position.x, ce.body.position.y - 20, 'ACCESSO BLOCCATO', '#e0503f');
  // Macio lo dice ogni tanto, senza fare la predica
  if (G.t - (G.macioBlockT || -99) > 14 && G.macio.ai.state !== 'phone') {
    G.macioBlockT = G.t;
    bubble(G.macio, G.stats.blocked > 1 ? 'Prima liberiamo il passaggio.' : 'Prima tiriamo fuori quello davanti, sennò per arrivare ai sub dobbiamo scavare.', 2.6);
  }
  const tied = bl.filter(locked);
  toast('Accesso bloccato: davanti c\'è ' + bl.map(b => b.def.name).join(' e ') + (tied.length ? (tied.length > 1 || bl.length > 1 ? ', ancora legati e frenati' : ', ancora legato e frenato') + '. Prima libera e porta fuori quello.' : '. Prima porta fuori quello.'), 'warn');
}
// la prima volta che si prende un certo tipo di case, una riga sola
function learnFrom (ce) {
  const d = ce.def;
  if (d.heavy2 && ce.grabbers.length < 2) {
    unlock('help');
    once('due', '⚠ 2 PERSONE: ci andate Tu e Macio insieme, quando tutti e due siete liberi.', 'warn');
  } else if (d.wheel !== 'hand') {
    once('pesante', d.name + ': pesa, si spinge. Parte piano e si ferma piano.');
  } else if (FRAGILE(d)) {
    once('fragile', '⚠ FRAGILE: ' + d.what + '. Piano, niente urti.', 'warn');
  } else {
    once('mano', 'Il nastro colorato dice in che zona va.');
  }
}

/* ---------------------------------------------------------------------
   IL CARRELLO A DUE RUOTE: sta nel furgone vicino al portellone, lo tira
   fuori Macio appena la rampa è giù. Tre posti sulla pala (un case pesante
   ne prende due: un sub e una testa, per esempio), un viaggio solo. Si spinge come un case con le ruote; passa il
   gradino sulle sue ruote grandi; se sbatte, il carico si fa male.
   --------------------------------------------------------------------- */
// sulla pala va qualsiasi case che non sia da due persone; sopra, solo un
// case da mano non più grande di quello sotto
function cartUsed (t) { return t.load.length; }
function canBase (ce) { return !!ce && ce.kind === 'case' && !ce.def.heavy2; }
function canTop (t, ce) {
  const b = t.load[0];
  return !!b && t.load.length === 1 && !!ce && ce.kind === 'case' && carriable(ce) && ce.def.w * ce.def.h <= b.def.w * b.def.h && Math.max(ce.def.w, ce.def.h) <= Math.max(b.def.w, b.def.h);
}
// il carrello è al suo posto accanto alla rampa (o lì vicino): si carica lì
function cartAtVan (t) { const p = t.body.position; return Math.hypot(p.x - TROLLEY_AT.x, p.y - TROLLEY_AT.y) < 110 && !zoneAt(p); }
// quello che c'è sulla pala e impedisce di caricare ce (come la prova di loadBase)
function baseBlocker (t, ce, w) {
  const d0 = angDiff(ce.body.angle, t.body.angle), quarter = Math.round(d0 / (Math.PI / 2));
  const depth = quarter % 2 ? ce.def.h : ce.def.w, p0 = { x: ce.body.position.x, y: ce.body.position.y }, a0 = ce.body.angle;
  Body.setPosition(ce.body, add(t.body.position, rot({ x: t.def.w / 2 + depth / 2 + 1, y: 0 }, t.body.angle))); Body.setAngle(ce.body, t.body.angle + quarter * Math.PI / 2);
  const hit = overlap(ce.body, obstacles(w, ce).filter(b => b !== t.body));
  Body.setPosition(ce.body, p0); Body.setAngle(ce.body, a0);
  return hit;
}
// dove sta un case sulla pala (dritto o di traverso), come lo mette loadBase
function cartSlots (t, ce) {
  return [0, 1].map(q => {
    const depth = q ? ce.def.h : ce.def.w, at = add(t.body.position, rot({ x: t.def.w / 2 + depth / 2 + 1, y: 0 }, t.body.angle));
    return { x: at.x, y: at.y, a: t.body.angle + q * Math.PI / 2 };
  });
}
function cartFits (t, ce) { return t.load.length ? canTop(t, ce) : canBase(ce); }
function spawnTrolley () {
  const b = Bodies.rectangle(TROLLEY_AT.x, TROLLEY_AT.y, 64, 46, { isStatic: true, chamfer: { radius: 4 }, friction: 0, restitution: 0,
    collisionFilter: { category: CAT.TROLLEY, mask: CAT.WALL | CAT.WORKER | CAT.NPC | CAT.CASE, group: 0 } });
  const t = { kind: 'trolley', body: b, load: [], grabbers: [], lastHit: -1,
    def: { id: 'carrello', name: 'Carrello', kg: 14, w: 64, h: 46, wheel: 'swivel', frag: 'bassa', zone: null } };
  b.plugin.ent = t;
  Composite.add(G.world, b);
  G.trolley = t; unlock('cart');
  $('#h-cart').hidden = false; $('#h-cart').classList.add('reveal');
  ring(TROLLEY_AT.x, TROLLEY_AT.y, '#8fa3b8'); AU.clack();
  bubble(G.macio, 'Ecco il carrello. Due ruote, zero pensieri.', 2.6);
  toast('CARRELLO: scegli un case, attiva CARRELLO e tocca la zona. Sopra ci sta un case piccolo: + SOPRA. Al resto pensa chi lo porta.', 'ok');
}
// distanza fra due sagome (riquadri), 0 se si toccano
function boundsGap (a, b) {
  const dx = Math.max(a.min.x - b.max.x, b.min.x - a.max.x, 0), dy = Math.max(a.min.y - b.max.y, b.min.y - a.max.y, 0);
  return Math.hypot(dx, dy);
}
// dal lato delle maniglie (dietro, -x del carrello) e non di lato o davanti
function atHandles (w, t) {
  const L = toLocal(t.body, w.body.position), hw = t.def.w / 2, hh = t.def.h / 2;
  return L.x < -hw + 2 && Math.abs(L.y) < hh * 0.7 && surface(t, w.body.position).dist - w.r < 14;
}
function grabTrolley (w, t) {
  if (!atHandles(w, t)) { if (w === G.player) toast('Il carrello si prende dalle maniglie: mettiti dietro, dalla parte del manico.', 'warn'); return false; }
  if (t.grabbers.length) return false;
  // dritto dietro al manico: guarda dove guarda il carrello, nessuno scatto
  w.facing = t.body.angle;
  w.hold = { off: rot(sub(t.body.position, w.body.position), -w.facing), rel: 0 };
  w.grab = t; w.mode = 'push'; w.vel = { x: 0, y: 0 }; t.grabbers.push(w);
  if (w === G.player) AU.pick();
  refreshFilter(t);
  return true;
}
// la pala va sotto il case: il case si gira (di poco) dritto sul carrello e
// resta davanti al telaio, appoggiato alla pala
function loadBase (w, ce) {
  const t = G.trolley;
  if (locked(ce)) { toast(ce.def.name + (strapOn(ce) ? ': è ancora legato con la cinghia.' : ': ha il freno tirato.'), 'warn'); return; }
  if (blockers(ce).length) { blockedTry(ce); return; }
  if (!canBase(ce)) { bubble(G.macio, 'Quello lo facciamo in due, non sul carrello.', 1.8); return; }
  // dritto o di traverso, come è più vicino a com'è adesso
  const d0 = angDiff(ce.body.angle, t.body.angle), quarter = Math.round(d0 / (Math.PI / 2));
  const rel = quarter * Math.PI / 2, depth = quarter % 2 ? ce.def.h : ce.def.w;
  const off = { x: t.def.w / 2 + depth / 2 + 1, y: 0 };
  const p0 = { x: ce.body.position.x, y: ce.body.position.y }, a0 = ce.body.angle;
  Body.setPosition(ce.body, add(t.body.position, rot(off, t.body.angle))); Body.setAngle(ce.body, t.body.angle + rel);
  if (overlap(ce.body, obstacles(w, ce).filter(b => b !== t.body))) {
    Body.setPosition(ce.body, p0); Body.setAngle(ce.body, a0);
    toast('Qui non c\'è spazio per caricarlo: allarga un po\'.', 'warn'); return;
  }
  unpark(ce);
  ce.onTrolley = t; ce.zone = null; ce.cart = { off, rel };
  t.load = [ce];
  placeLoad(t); refreshFilter(t);
  AU.clack(); floatText(t.body.position.x, t.body.position.y - 34, 'CARICATO', '#cfdbe8');
}
function loadTop (w) {
  const t = G.trolley, ce = w.grab, b = t.load[0];
  if (!canTop(t, ce)) { toast('Sopra al ' + b.def.short + ' ci sta solo un case piccolo da mano.', 'warn'); return; }
  release(w);
  unpark(ce);
  ce.onTrolley = t; ce.zone = null; ce.cart = { off: b.cart.off, rel: b.cart.rel, top: true };
  t.load.push(ce);
  placeLoad(t); refreshFilter(t);
  AU.clack(); floatText(t.body.position.x, t.body.position.y - 34, 'SOPRA', '#cfdbe8');
}
// i case sul carrello stanno fermi rispetto a lui
function placeLoad (t) {
  for (const ce of t.load) {
    Body.setPosition(ce.body, add(t.body.position, rot(ce.cart.off, t.body.angle)));
    Body.setAngle(ce.body, t.body.angle + ce.cart.rel);
  }
}
// da fermo: quello sopra va giù di fianco (meglio dentro la zona del suo

function unloadTrolley (w) {
  const t = G.trolley;
  const ce = t.load[t.load.length - 1];
  if (ce.cart.top) {
    const b = t.load[0], bw = b.def.w, bh = b.def.h;   // nel verso del case sulla pala
    const cw = Math.max(ce.def.w, ce.def.h);
    const cands = [{ x: 0, y: bh / 2 + cw / 2 + 3 }, { x: 0, y: -bh / 2 - cw / 2 - 3 }, { x: bw / 2 + cw / 2 + 3, y: 0 }];
    let spot = null;
    t.load = t.load.filter(c => c !== ce); ce.onTrolley = null;
    for (const c of cands) {
      const at = add(b.body.position, rot(c, b.body.angle));
      Body.setPosition(ce.body, at); Body.setAngle(ce.body, b.body.angle);
      if (overlap(ce.body, obstacles(w, ce))) continue;
      if (zoneAt(at) === ce.def.zone) { spot = at; break; }
      if (!spot) spot = at;
    }
    if (!spot) { t.load.push(ce); ce.onTrolley = t; placeLoad(t); toast('Qui non c\'è posto per appoggiarlo: sposta un po\' il carrello.', 'warn'); return; }
    Body.setPosition(ce.body, spot);
  } else {
    t.load = []; ce.onTrolley = null;
  }
  delete ce.cart; ce.lastCarrier = w;
  refreshFilter(ce); refreshFilter(t);
  AU.drop(); floatText(ce.body.position.x, ce.body.position.y - 26, 'SCARICATO', '#cfdbe8');
}
/* Un case lasciato nella SUA zona è consegnato («parcheggiato»): conta
   come a posto finché qualcuno non lo riprende. */
function park (ce) { ce.parked = true; }
function unpark (ce) { ce.parked = false; }
// lasciare: l'oggetto resta esattamente dov'è. Se lo lascia chi guida,
// lo lascia anche chi aiutava
function release (w) {
  const ce = w.grab; if (!ce) return;
  const leader = holderOf(ce) === w;
  ce.grabbers = ce.grabbers.filter(x => x !== w);
  if (ce.carrier === w) ce.carrier = null;
  ce.lastCarrier = w;
  if (w.hold && w.hold.helper) w.body.collisionFilter.mask = w.hold.mask;
  w.grab = null; w.mode = null; w.hold = null; w.vel = { x: 0, y: 0 };
  if (leader) for (const h of [...ce.grabbers]) release(h);
  refreshFilter(ce);
}

/* ---------------------------------------------------------------------
   DANNI
   --------------------------------------------------------------------- */
function damage (ce, amt, cause) {
  if (amt <= 0.5 || G.mode === 'end') return;
  const before = stateOf(ce.integrity);
  ce.integrity = Math.max(ce.def.unique ? 15 : 0, ce.integrity - amt);
  ce.flash = 0.5;
  if (amt >= 5) puff(ce.body.position.x, ce.body.position.y, 6, 'rgba(242,164,61,', 1.6);
  if (ce.def.id === 'par') { // un PAR si rompe ogni 25 punti di danno accumulati
    // al massimo un PAR per colpo: il case li tiene separati
    const left = Math.max(ce.pars - 1, 4 - Math.floor((100 - ce.integrity) / 25));
    if (left < ce.pars) { ce.pars = left; AU.crack(); bubble(ce, 'Crack! Un PAR rotto (' + ce.pars + '/4)', 2); }
  }
  const after = stateOf(ce.integrity);
  if (after !== before) {
    const bad = after === 'difettoso' || after === 'rotto';
    toast(ce.def.name + ': ' + STATE_LABEL[after] + (cause ? ' (' + cause + ')' : ''), bad ? 'bad' : 'warn');
    if (bad) AU.crack();
  }
}
/* OH-ISSA: un case a spinta arriva al gradino della palestra, chi spinge si
   ferma, Macio conta «uno… due… ISSA!» e il case passa (vedi follow). */
const BEATS = [0.35, 0.95, 1.55];
function nearStep (ce) {
  const b = ce.body.bounds, y = ce.body.position.y;
  return b.max.x > GYM_X - 14 && ce.body.position.x < GYM_X && y > STEP_BAND.y1 - 20 && y < STEP_BAND.y2 + 20;
}
function updateQte (dt) {
  const q = G.qte; if (!q) return;
  if (!holderOf(q.ce)) { G.qte = null; return; }
  q.t += dt;
  let beat = -1; for (let i = 0; i < 3; i++) if (q.t >= BEATS[i]) beat = i;
  if (beat !== q.beat) {
    q.beat = beat;
    bubble(G.macio, ['Uno…', 'Due…', 'ISSA!'][beat], 0.55);
    AU.tone(beat === 2 ? 660 : 440, beat === 2 ? 990 : 440, 0.12, 0.12);
  }
  if (q.t >= BEATS[2] + 0.15) {
    G.qte = null; AU.hey();
    q.ce.liftUntil = G.t + 1.2; q.ce.hopUntil = G.t + 0.9; refreshFilter(q.ce);
    puff(q.ce.body.position.x, q.ce.body.position.y, 10, 'rgba(190,190,196,', 1.4);
    bubble(G.player, 'Su!', 0.8);
  }
}

/* ---------------------------------------------------------------------
   MACIO, IL COLLEGA — lavora solo su ordine (vedi ORDINI). Fra un ordine
   e l'altro aspetta, chiacchiera, e ogni tanto lo chiama la moglie.
   --------------------------------------------------------------------- */
function macio (state, data) {
  const T = G.macio;
  if (T.grab && state === 'phone') release(T);
  T.ai = Object.assign({ state, t: 0 }, data || {});
}
function updateMacio (dt) {
  const T = G.macio, ai = T.ai;
  ai.t += dt;
  if (ai.state === 'phone') {
    if (ai.t > 12) { macio('idle'); bubble(T, 'Scusa capo, eccomi.', 1.6); }
    return;
  }
  // la risposta a un ordine, un attimo dopo il fumetto del capo
  if (T.reply && G.t >= T.reply.at) { if (T.reply.text) { bubble(T, T.reply.text, 1.6); AU.hey(); } T.reply = null; }
  if (busy(T)) { ai.t = 0; return; }
  if (ai.t > 9 && !ai.said && G.mode === 'play' && G.van.ramp) {
    ai.said = true; bubble(T, ['Che faccio, capo?', 'Questo pesa come mia suocera…', 'Dimmi tu, io spingo.'][Math.floor(Math.random() * 3)], 1.8);
  }
}

/* ---------------------------------------------------------------------
   MOVIMENTO E PRESA — un sistema solo per persone, case e carrello.

   Nessuno si guida a mano: ognuno va dove l'ordine lo manda lungo una
   strada già provata (vedi ORDINI), un passo alla volta, con partenza e
   frenata brevi. Quello che si prende (case in mano, case spinto, carrello
   col suo carico) diventa rigido con chi lo tiene: sta sempre alla stessa
   distanza e con lo stesso angolo rispetto a lui, gira quando lui gira, e
   chi aiuta (il case da due) sta fermo dal suo lato. A ogni passo si prova
   la posa nuova di tutto il gruppo contro muri, case, carrello e persone:
   se qualcosa è in mezzo ci si ferma. Lasciato, l'oggetto resta lì.
   --------------------------------------------------------------------- */
const TROLLEY_AT = { x: DOOR_X + 90, y: 640 };   // dove Macio lascia il carrello, accanto alla rampa (dalle maniglie ci si arriva)
const MOVE = { acc: 0.5, dec: 0.8 };    // px/passo per passo: da fermo a pieno in ~7 passi, stop in ~4
function holderOf (ent) { return ent.carrier || ent.grabbers[0] || null; }
// un case senza ruote da due persone non si trascina: lo si alza in due
function liftedByTwo (ent) { return ent.kind === 'case' && ent.def.wheel === 'none' && ent.grabbers.length >= 2; }
// quello che ferma chi tiene ent (ent = null: a mani vuote)
function obstacles (w, ent) {
  const out = [];
  for (const b of G.statics) {
    // il gradino ferma solo un case spinto a terra (in mano o col carrello passa)

// i case non hanno una fisica loro: li muove chi li prende (PRESA)

  if (ce.liftUntil > 0) {

    const astride = bb.max.x > GYM_X - 8 && bb.min.x < GYM_X + 8;

/* I bambini e Gerry non spingono contro gli ostacoli: guardano un passo

// quello contro cui sbattono in cortile (il gradino ferma solo i case)
function npcObstacles () {
  const out = G.statics.filter(b => b !== G.stepBody);
  for (const c of G.cases) if (!c.hidden && !c.onTrolley) out.push(c.body);
  if (G.trolley) out.push(G.trolley.body);
  for (const w of G.workers) out.push(w.body);

   PASSO DI SIMULAZIONE
   --------------------------------------------------------------------- */
function stepSim () {
  const dt = 1 / 60;
  if (G.mode === 'wrap') { wrapStep(dt); return; }
  if (G.mode === 'intro') {
    G.introT += dt;
    if (G.introT > 0.8) { G.mode = 'play'; goal('Il furgone è chiuso: APRI IL PORTELLONE, qui sotto (o tocca il portellone).'); }
  } else if (G.mode === 'play') {
    G.t += dt;
    vanStep(dt);
    scriptEvents();
    progress();
    updateQte(dt);
  }
  const prevX = G.cases.map(c => c.body.position.x);
  const prevW = G.workers.map(w => ({ x: w.body.position.x, y: w.body.position.y }));
  updateWorkers(dt);
  updateMacio(dt);
  placeHelpers();
  updateKids(dt);
  for (const ce of G.cases) updateCase(ce, dt);

  // le persone (e quello che tengono) si muovono solo coi loro passi: un urto
  // (Gerry col carrello, un bambino che corre) non le trascina via
  const keep = [];
  for (const w of G.workers) {
    keep.push(w.body);
    if (w.grab) { keep.push(w.grab.body); if (w.grab.kind === 'trolley') for (const c of w.grab.load) keep.push(c.body); }
  }
  const kp = keep.map(b => ({ b, x: b.position.x, y: b.position.y, a: b.angle }));
  Engine.update(G.engine, STEP);
  for (const k of kp) if (k.b.position.x !== k.x || k.b.position.y !== k.y || k.b.angle !== k.a) { Body.setPosition(k.b, { x: k.x, y: k.y }); Body.setAngle(k.b, k.a); if (!k.b.isStatic) Body.setVelocity(k.b, { x: 0, y: 0 }); }
  if (G.trolley) placeLoad(G.trolley);

  // dopo il passo: quanto si è mosso davvero ognuno (passi, incastri), cadute, consegne
  G.workers.forEach((w, i) => {
    w.mv = sub(w.body.position, prevW[i]); w.spd = len(w.mv);
    w.stillT = w.spd < 0.1 && w.job ? (w.stillT || 0) + dt : 0;
    if (!w.grab) { w.vel = { x: w.body.velocity.x, y: w.body.velocity.y }; if (len(w.vel) > w.vmax * 1.3) w.vel = mul(norm(w.vel), w.vmax * 1.3); }
    w.stride = (w.stride || 0) + w.spd;
  });
  for (const k of G.kids) k.stride = (k.stride || 0) + speedOf(k.body);
  G.cases.forEach((ce, i) => {
    const p = ce.body.position;
    if (ce.onTrolley) { ce.zone = null; return; }
    // giù dal pianale fuori dalla rampa
    if (!ce.carrier && prevX[i] <= DOOR_X && p.x > DOOR_X && (p.y < RAMP.y || p.y > RAMP.y + RAMP.h)) {
      damage(ce, 30 * FRAG[ce.def.frag].mult, 'caduto dal furgone'); AU.thud(6);
      bubble(ce, 'Giù dal furgone!', 1.6);
    }
    const held = ce.carrier || ce.grabbers.length;
    if (!held && speedOf(ce.body) < 1.2) {
      const z = zoneAt(p);
      if (z !== ce.zone) { ce.zone = z; if (z === ce.def.zone && G.mode === 'play') delivered(ce); else if (z && G.mode === 'play' && !ce.hidden) wrongZone(ce, z); }
      if (z === ce.def.zone && speedOf(ce.body) < 0.3 && G.mode === 'play') park(ce);
    } else if (held) ce.zone = null;
  });

  if (G.mode === 'play') {
    const placed = c => c.zone === c.def.zone && !c.carrier && !c.grabbers.length && !c.onTrolley;
    // tutto il materiale visto scaricato… ma in fondo al furgone c'è ancora il telo
    if (!G.surprise && G.cases.every(c => c.def.surprise || placed(c))) startSurprise();
    surpriseStep();
    const done = G.surprise && G.surprise.revealed && G.cases.every(placed);
    if (done) { G.endDelay += dt; if (G.endDelay > (G.surprise.late ? 2.2 : 0.8)) startWrap(); } else G.endDelay = 0;
    if (G.t >= GAME_SECONDS) endGame('tempo');
  }
  G.bubbles = G.bubbles.filter(b => b.until > G.t);
}

    ctx.fillStyle = w.trim; ctx.fillRect(r * 0.35, -r * 0.3, r * 0.3, r * 0.6);
  } else { // Macio: pelato coi baffi

    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r * 0.45, -r * 0.22); ctx.lineTo(r * 0.45, r * 0.22); ctx.stroke();
  }

/* effetti: polvere negli urti, scintille nei danni, onda alle consegne */
function puff (x, y, n, color, speed) {
  if (!G) return;
  const now = performance.now();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (speed || 1) * rand(0.3, 1);
    G.fx.push({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rand(3, 7), color: color || 'rgba(200,200,205,', born: now, life: rand(350, 650) });
  }
}
function ring (x, y, color) { if (G) G.fx.push({ kind: 'ring', x, y, color, born: performance.now(), life: 700 }); }
function drawFx () {
  const now = performance.now();
  G.fx = G.fx.filter(f => now - f.born < f.life);
  for (const f of G.fx) {
    const k = (now - f.born) / f.life;
    if (f.kind === 'dot') {
      const x = f.x + f.vx * k * 30, y = f.y + f.vy * k * 30;
      ctx.fillStyle = f.color + (0.55 * (1 - k)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, f.r * (0.6 + k), 0, Math.PI * 2); ctx.fill();
    } else if (f.kind === 'text') {
      ctx.save(); ctx.globalAlpha = k < 0.7 ? 1 : (1 - k) / 0.3;
      ctx.font = '700 17px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(12,13,16,.85)'; ctx.strokeText(f.text, f.x, f.y - k * 34);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y - k * 34);
      ctx.restore();
    } else {
      ctx.strokeStyle = f.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, 20 + k * 50, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }
}

/* gli ordini sulla scena: chi è scelto (anello), il case scelto, la strada
   che sta facendo ognuno e il posto dove poserà il case */
function drawOrders () {
  if (G.mode !== 'play') return;
  const S = G.sel, pulse = 0.55 + 0.45 * Math.sin(performance.now() / 160);
  for (const w of G.workers) {
    const j = w.job, s = j && j.steps && j.steps[j.si];
    if (s && s.path) {
      ctx.save(); ctx.strokeStyle = w.trim; ctx.globalAlpha = 0.55; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(w.body.position.x, w.body.position.y);
      for (let i = s.pi; i < s.path.length; i++) if (s.path[i].t === 'move') ctx.lineTo(s.path[i].x, s.path[i].y);
      ctx.stroke(); ctx.restore();
    }
  }
  for (const sp of G.spots) {
    const c = sp.ce, z = c && ZONES[c.def.zone], b = sp.box;
    ctx.save(); ctx.strokeStyle = z ? z.color : '#eee9df'; ctx.globalAlpha = 0.5; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    rr(b.min.x + 2, b.min.y + 2, b.max.x - b.min.x - 4, b.max.y - b.min.y - 4, 4); ctx.stroke(); ctx.restore();
  }
  const p = S.who.body.position;
  ctx.save(); ctx.strokeStyle = '#f2a541'; ctx.lineWidth = 3; ctx.globalAlpha = 0.6 + 0.4 * pulse;
  ctx.beginPath(); ctx.arc(p.x, p.y, S.who.r + 7, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  for (const ce of [S.ce, S.top]) {
    if (!ce) continue;
    const v = ce.body.vertices;
    ctx.save(); ctx.strokeStyle = 'rgba(242,165,65,' + pulse + ')'; ctx.lineWidth = 4;
    ctx.beginPath(); v.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)); ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  // il case scelto: la sua zona si accende
  if (S.ce) { const z = ZONES[S.ce.def.zone]; ctx.save(); ctx.fillStyle = z.color; ctx.globalAlpha = 0.1 + 0.08 * pulse; ctx.fillRect(z.x, z.y, z.w, z.h); ctx.restore(); }
}
function worldToScreen (p) { return { x: (p.x - G.cam.x) * G.cam.scale + W / 2, y: (p.y - G.cam.y) * G.cam.scale + H / 2 }; }
function entPos (e) { return e.body ? e.body.position : e; }

function drawScreenUI () {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // il case scelto: la sua scheda (nome, peso, dove va, cosa serve)
  const S = G.sel, ce = G.mode === 'play' && S.ce;
  if (ce) {
    const s = worldToScreen(ce.body.position), tags = [];
    if (ce.def.heavy2) tags.push(['⚠ 2 PERSONE', '#f2a541']);
    if (FRAGILE(ce.def)) tags.push(['⚠ FRAGILE', '#e0503f']);
    if (ce.brake) tags.unshift(['FRENO TIRATO', '#e0503f']);
    if (!S.pickTop && busy(S.who)) tags.push(['DOPO L\'ORDINE IN CORSO', '#8fa3b8']);
    const sub = S.pickTop ? 'tocca il case da mettere sopra' : whoName(S.who).toUpperCase() + ' · ' + (S.cart ? 'col carrello' + (S.top ? ' con ' + S.top.def.short : '') : weightClass(ce.def)) + ' · va in ' + ZONES[ce.def.zone].name.toUpperCase();
    label(s.x, s.y - ce.def.h * G.cam.scale / 2 - 16, ce.def.name.toUpperCase() + ' — ' + ce.def.what, sub, ZONES[ce.def.zone].color, tags);
  }
  // freccia verso la zona dove sta andando chi è scelto
  const j = S.who.job, jz = j && j.dest && j.dest.zone;
  if (jz) { const z = ZONES[jz]; edgeArrow({ x: z.x + z.w / 2, y: z.y + z.h / 2 }, z.color, z.name.toUpperCase()); }
  // i PAR rimasti nel loro case: quattro lucine (il danno si vede sul case)
  for (const ce of G.cases) {
    if (ce.def.id !== 'par' || ce.hidden || ce.onTrolley || ce.pars === 4) continue;
    const s = worldToScreen({ x: ce.body.position.x, y: ce.body.bounds.min.y });
    for (let i = 0; i < 4; i++) { ctx.fillStyle = i < ce.pars ? '#eaff2b' : '#5a2a24'; ctx.fillRect(Math.round(s.x - 14 + i * 7), Math.round(s.y - 12), 5, 6); }
  }
  // chi ha un ordine ed è fermo: perché (sopra la testa, piccolo)
  ctx.font = '700 12px "Barlow Condensed", sans-serif';
  for (const w of G.workers) {
    if (G.mode !== 'play' || G.bubbles.some(b => b.ent === w)) continue;
    // ordine impossibile (rosso, un attimo) o attesa con un perché (giallo)
    const failed = !w.job && G.t - (w.failT || -9) < 2.5;
    const why = failed ? '✕ non si può' : (w.stillT || 0) >= 0.6 && waitWhy(w); if (!why) continue;
    const col = failed ? '#e0503f' : '#f2c53d';
    const s = worldToScreen(w.body.position), t = why.toUpperCase(), tw = ctx.measureText(t).width + 12;
    const x = clamp(s.x - tw / 2, 6, W - tw - 6), y = Math.max(64, s.y - w.r * G.cam.scale - 24);
    ctx.fillStyle = 'rgba(28,29,34,.92)'; ctx.strokeStyle = col; ctx.lineWidth = 1; rr(x, y, tw, 17, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = col; ctx.fillText(t, x + 6, y + 13);
  }
  // nuvolette
  ctx.font = '600 13px Inter, system-ui, sans-serif';
  for (const b of G.bubbles) {
    const s = worldToScreen(entPos(b.ent));
    const tw = Math.min(ctx.measureText(b.text).width, 220), bw = tw + 18, bh = 26;
    let x = clamp(s.x - bw / 2, 8, W - bw - 8), y = s.y - 34 * Math.max(G.cam.scale, 0.8) - bh;
    y = Math.max(64, y);
    ctx.fillStyle = '#f4f1ea'; ctx.strokeStyle = '#141519'; ctx.lineWidth = 2;
    rr(x, y, bw, bh, 9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(clamp(s.x, x + 10, x + bw - 10) - 6, y + bh - 1); ctx.lineTo(clamp(s.x, x + 10, x + bw - 10), y + bh + 7); ctx.lineTo(clamp(s.x, x + 10, x + bw - 10) + 6, y + bh - 1); ctx.fill();
    ctx.fillStyle = '#141519'; ctx.fillText(b.text, x + 9, y + 17, 220);
  }
}
// freccia sul bordo dello schermo verso un punto fuori vista
function edgeArrow (p, color, text) {
  const c = worldToScreen(p), m = 40;
  if (c.x >= m && c.x <= W - m && c.y >= 70 && c.y <= H - m) return;
  const cx = W / 2, cy = H / 2, dx = c.x - cx, dy = c.y - cy;
  const k = Math.min((W / 2 - m) / Math.abs(dx || 1), (H / 2 - m - 30) / Math.abs(dy || 1));
  const ax = cx + dx * k, ay = cy + dy * k + 10, a = Math.atan2(dy, dx);
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-5, 0); ctx.lineTo(-10, 12); ctx.fill();
  ctx.restore();
  ctx.fillStyle = color; ctx.font = '700 13px "Barlow Condensed", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(text, ax - Math.cos(a) * 28, ay - Math.sin(a) * 28 + 4); ctx.textAlign = 'left';
}
// la scheda del case: titolo, peso e classe, e i bollini (2 PERSONE, FRAGILE, BLOCCATO)
function label (x, y, title, sub, color, tags) {
  tags = tags || [];
  const maxW = Math.min(300, W - 16);
  ctx.font = '700 14px "Barlow Condensed", sans-serif';
  const w1 = Math.min(ctx.measureText(title).width, maxW - 22); ctx.font = '500 11px Inter, system-ui, sans-serif';
  const w2 = Math.min(ctx.measureText(sub).width, maxW - 22);
  ctx.font = '700 11px "Barlow Condensed", sans-serif';
  const tw = tags.map(t => ctx.measureText(t[0]).width + 10);
  const w3 = tw.reduce((a, b) => a + b + 4, 0);
  const bw = Math.max(w1, w2, w3) + 22, bh = tags.length ? 54 : 36;
  const bx = clamp(x - bw / 2, 8, W - bw - 8), by = Math.max(64, y - bh);
  ctx.fillStyle = 'rgba(28,29,34,.94)'; ctx.strokeStyle = tags.length ? tags[0][1] : '#34363e'; ctx.lineWidth = 1; rr(bx, by, bw, bh, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = color; ctx.fillRect(bx + 7, by + 7, 4, bh - 14);
  ctx.fillStyle = '#eee9df'; ctx.font = '700 14px "Barlow Condensed", sans-serif'; ctx.fillText(title, bx + 16, by + 16, bw - 22);
  ctx.fillStyle = '#a6a9b2'; ctx.font = '500 11px Inter, system-ui, sans-serif'; ctx.fillText(sub, bx + 16, by + 29, bw - 22);
  let tx = bx + 16;
  ctx.font = '700 11px "Barlow Condensed", sans-serif';
  tags.forEach(([t, c], i) => {
    const pulse = t === 'ACCESSO BLOCCATO' || t === '⚠ 2 PERSONE' ? 0.75 + 0.25 * Math.sin(performance.now() / 160) : 1;
    ctx.globalAlpha = pulse; ctx.fillStyle = c; rr(tx, by + 35, tw[i], 14, 3); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#141519'; ctx.fillText(t, tx + 5, by + 46); tx += tw[i] + 4;
  });
}

/* Dove guarda la telecamera (se non la trascini): sul case scelto; dato un
   ordine torna sul furgone, dove c'è il prossimo case da scegliere; scelto
   un collega, su di lui. Sul telefono non si vedono furgone e palestra
   insieme: così non serve trascinare la scena a ogni ordine. */
const VAN_VIEW = { x: (VAN.x1 + DOOR_X) / 2 + 60, y: 500 };
function camFocus () {
  const S = G.sel;
  if (S.ce) return S.ce.body.position;
  if (G.cam.focus === 'van' && G.cases.some(c => !c.hidden && !c.job && !c.onTrolley && c.zone !== c.def.zone && c.body.position.x < GYM_X)) return VAN_VIEW;
  return S.who.body.position;
}
function render () {
  // camera: segue il giocatore; su telefono si vede meno mondo ma più grande
  const wv = G.mode === 'wrap' || (G.mode === 'end' && G.wrap) ? wrapView() : null;
  const want = wv ? clamp(Math.min(W / wv.fit, (H - 60) / wv.fit), 0.35, 1.4) : clamp(Math.min(W / 680, (H - 60) / 520), 0.5, 1.4);
  // la scena finisce sopra la barra d'aiuto (e sopra i pulsanti, sul telefono)
  // la telecamera segue chi è scelto; trascinando si guarda altrove
  const man = !wv && G.mode === 'play' && G.cam.manual;
  const pp = wv || man || (G.mode === 'intro' || G.mode === 'end' && !G.wrap ? VAN_VIEW : camFocus());
  const target = { x: pp.x, y: pp.y };
  const k = wv ? 0.05 : man ? 1 : 0.12;
  G.cam.scale += (want - G.cam.scale) * (wv ? 0.05 : 1);
  const scale = G.cam.scale;
  G.cam.x += (target.x - G.cam.x) * k; G.cam.y += (target.y - G.cam.y) * k;
  const hw = W / 2 / scale, hh = H / 2 / scale;
  G.cam.x = WORLD.x2 - WORLD.x1 > hw * 2 ? clamp(G.cam.x, WORLD.x1 + hw, WORLD.x2 - hw) : (WORLD.x1 + WORLD.x2) / 2;
  G.cam.y = WORLD.y2 - WORLD.y1 > hh * 2 ? clamp(G.cam.y, WORLD.y1 + hh - 50 / scale, WORLD.y2 - hh + 60 / scale) : (WORLD.y1 + WORLD.y2) / 2;
  if (man) G.cam.manual = { x: G.cam.x, y: G.cam.y };

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#141519'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (W / 2 - G.cam.x * scale), DPR * (H / 2 - G.cam.y * scale));
  drawGround(); drawZones(); drawStatics();
  const up = c => c.carrier || G.t < c.liftUntil || liftedByTwo(c);
  const ground = G.cases.filter(c => !up(c) && !c.onTrolley).sort((a, b) => a.body.position.y - b.body.position.y);
  ground.forEach(drawCase);
  drawLocks();
  drawTrolley();
  if (G.trolley) G.trolley.load.forEach(drawCase);
  if (G.tarp && G.t - G.tarp < 1.2) drawTarp(G.cases.find(c => c.def.surprise), (G.t - G.tarp) / 1.2);
  G.kids.forEach(drawKid);
  drawCart();
  drawOrders();
  G.workers.forEach(drawWorker);
  G.cases.filter(up).forEach(drawCase);
  drawFx();
  drawTreeTop();
  // un filo di vignettatura: il centro dello schermo resta più luminoso
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawScreenUI();
}

/* EFFICIENZA: non solo finire, ma lavorare bene. Cinque voci, senza formule
   a vista: tempo, viaggi (e carrello), materiale, squadra, ordine. */
function efficiency (final, reason) {
  const S = G.stats, t = G.t;
  const n = G.cases.filter(c => c.zone === c.def.zone).length;
  // tempo: alla fine conta l'ora; durante, il passo (un case ogni ~25 s)
  const tempo = final ? (reason === 'tempo' ? 30 : t <= 230 ? 100 : clamp(100 - (t - 230) / 130 * 55, 40, 100))
    : clamp(100 - Math.max(0, t - 30 - n * 26) * 0.8, 40, 100);
  // col carrello lì e mai usato, i viaggi non possono andare bene
  const viaggi = Math.min(final && G.trolley && !S.cartTrips ? 60 : 100, clamp(100 - 15 * S.wasted, 0, 100));
  const materiale = clamp(100 - 10 * S.hits - 8 * S.rough, 0, 100);
  const squadra = Math.min(final && !G.team ? 50 : 100, clamp(100 - 30 * S.solo, 0, 100));
  const ordine = clamp(100 - 15 * Math.max(0, S.blocked - 1) - 15 * S.wrongDrop, 0, 100);
  const score = Math.round(0.25 * tempo + 0.2 * viaggi + 0.25 * materiale + 0.15 * squadra + 0.15 * ordine);
  return { score, tempo, viaggi, materiale, squadra, ordine };
}

// il giudizio sul lavoro, a parole: i numeri restano dentro il gioco
function workWord (score) { return score >= 85 ? 'Ottimo' : score >= 65 ? 'Buono' : 'Sufficiente'; }
// cinque stelle solo se hai usato bene anche il carrello
function stars (score, cartOk) { const n = Math.min(cartOk ? 5 : 4, score >= 90 ? 5 : score >= 75 ? 4 : score >= 60 ? 3 : score >= 40 ? 2 : 1); return '★'.repeat(n) + '☆'.repeat(5 - n); }
function workVerdict (score) { return score >= 85 ? 'Lavoro da professionista.' : score >= 65 ? 'Buon ritmo.' : 'Si può fare meglio.'; }

// ora a m minuti dalle 16:00
function clockAt (m) { return (16 + Math.floor(m / 60)) + ':' + String(m % 60).padStart(2, '0'); }
function montaggioStart (minutes) { return clockAt(30 + minutes); }

/* ---------------------------------------------------------------------
   FINE: LA BOLLA DI SCARICO
   --------------------------------------------------------------------- */
function endGame (reason) {
  if (G.mode === 'end') return;
  for (const w of G.workers) { w.job = null; w.jobs = []; release(w); }
  const rushed = [];
  // quello ancora sul carrello lo sistemano di corsa Macio e il bidello
  if (G.trolley) for (const ce of [...G.trolley.load]) { ce.onTrolley = null; delete ce.cart; ce.rushed = true; ce.zone = ce.def.zone; rushed.push(ce); }
  if (G.trolley) G.trolley.load = [];
  if (reason === 'tempo') {
    for (const ce of G.cases) {
      if (ce.body.position.x < GYM_X && !ce.rushed) { damage(ce, rand(5, 35) * FRAG[ce.def.frag].mult); ce.rushed = true; ce.zone = ce.def.zone; rushed.push(ce); }
    }
  }
  G.mode = 'end';
  const endClock = reason === 'tempo' ? clockAt(30 + rushed.length * 3) : fmtClock(G.t);
  const ric = G.cases.find(c => c.def.id === 'ricambio'), par = G.cases.find(c => c.def.id === 'par'), sta = G.cases.find(c => c.def.id === 'stativi');
  const ricOk = stateOf(ric.integrity) !== 'rotto';
  const parsBroken = 4 - par.pars;
  const staBroken = stateOf(sta.integrity) === 'rotto';
  let minutes = rushed.length * 3, rotti = parsBroken + (staBroken ? 1 : 0) + (ricOk ? 0 : 1);
  // i generici dei cavi: già nelle loro zone (si aprono al montaggio)
  const stowRows = G.stowed.map(ce => `<tr><td><b>${ce.def.name}</b><br><small>${ce.def.what} · ${ce.def.kg} kg</small></td>
      <td><span class="zdot" style="background:${ZONES[ce.def.zone].color}"></span>${ZONES[ce.def.zone].name} ✓ <small>(già in zona)</small></td>
      <td><span class="pill p-${stateOf(ce.integrity)}">${STATE_LABEL[stateOf(ce.integrity)]}</span></td><td>${stateOf(ce.integrity) === 'difettoso' ? ce.def.dif : 'i cavi dai pulsanti al montaggio'}</td></tr>`).join('');
  minutes += 10 * G.stowed.filter(c => stateOf(c.integrity) === 'difettoso').length;
  const rows = stowRows + G.cases.map(ce => {
    const st = stateOf(ce.integrity), z = ZONES[ce.def.zone];
    let zoneTxt, eff = [];
    if (ce.rushed) { zoneTxt = z.name + ' <small>(di corsa)</small>'; }
    else if (ce.zone === ce.def.zone) zoneTxt = z.name + ' ✓';
    else { zoneTxt = (ce.zone ? ZONES[ce.zone].name : 'fuori zona') + ' ✗ <small>andava in ' + z.name + '</small>'; minutes += 5; eff.push('da riportare in ' + z.name + ': +5 min'); }
    if (st === 'ammaccato') eff.push('solo graffi');
    if (st === 'difettoso') { eff.push(ce.def.dif); minutes += 10; }
    if (ce.def.id === 'par' && parsBroken > 0) eff.push(parsBroken + ' PAR rott' + (parsBroken > 1 ? 'i' : 'o'));
    if (ce.def.id === 'stativi' && staBroken) eff.push('uno stativo piegato');
    if (ce.def.id === 'ricambio' && !ricOk) eff.push('scorte perse: niente ricambi per la serata');
    return `<tr><td><b>${ce.def.name}</b><br><small>${ce.def.what} · ${ce.def.kg} kg</small></td>
      <td><span class="zdot" style="background:${z.color}"></span>${zoneTxt}</td>
      <td><span class="pill p-${st}">${STATE_LABEL[st]}</span></td>
      <td>${eff.length ? eff.join('; ') : '—'}</td></tr>`;
  }).join('');
  // cosa arriva al montaggio
  let parAvail = 4 - parsBroken, staAvail = 4 - (staBroken ? 1 : 0), spareNote = [];
  if (ricOk && parsBroken > 0) { parAvail++; minutes += 10; spareNote.push('un PAR dal case ricambi'); }
  if (ricOk && staBroken) { staAvail++; spareNote.push('uno stativo dal case ricambi'); }
  const birre = (rotti === 0 ? 1 : 0) + (reason === 'ok' ? 1 : 0);
  const allIntegro = G.cases.every(c => stateOf(c.integrity) === 'integro') && parsBroken === 0;
  // movimentazione brusca sul fragile: −1 a volta, al massimo −2
  const S = G.stats, roughRep = Math.min(2, S.rough);
  const rep = (allIntegro ? 3 : 0) - 2 * rotti - G.kidHits - roughRep;
  const late = reason !== 'ok';
  const E = efficiency(true, reason);
  const zn = ce => ce.zone ? ZONES[ce.zone].name : 'fuori zona';
  const cor = G.stowed.find(c => c.def.id === 'corrente'), seg = G.stowed.find(c => c.def.id === 'segnale');
  const cavi = 'Generico CORRENTE in ' + zn(cor) + ', Generico SEGNALE in ' + zn(seg) + ': li apri al montaggio.';
  const L = (ok, txt) => `<li class="${ok ? 'ok' : 'no'}"><b>${ok ? '✓' : '✗'}</b><span>${txt}</span></li>`;
  // come hai lavorato: tre righe a parole, prima quello che è andato meno bene
  const voci = [
    [E.tempo >= 80, E.tempo, reason === 'tempo' ? 'Alle 16:30 c\'era ancora roba fuori.' : E.tempo >= 80 ? 'Finito alle ' + endClock + ', in orario.' : 'Finito alle ' + endClock + ', al limite.'],
    [!!S.cartTrips || !G.trolley, E.viaggi, S.cartTrips ? 'Hai usato il carrello: ' + S.cartCases + ' case in ' + S.cartTrips + (S.cartTrips === 1 ? ' viaggio.' : ' viaggi.') : G.trolley ? 'Il carrello è rimasto fermo: tutto a mano.' : 'Tutto a mano, un case alla volta.'],
    [!S.hits, E.materiale, !S.hits ? 'Il materiale è arrivato sano.' : S.rough ? 'Il materiale fragile ha preso dei colpi.' : 'Qualche case ha preso dei colpi.'],
    [!S.solo && G.team, E.squadra, S.solo ? 'Hai provato da solo i case da due.' : G.team ? 'Macio ha lavorato con te.' : 'Macio non l\'hai mai chiamato.'],
    [S.blocked <= 1 && !S.wrongDrop, E.ordine, S.blocked <= 1 && !S.wrongDrop ? 'Furgone svuotato dal davanti, ogni case nella sua zona.' : S.wrongDrop ? 'Qualche case è finito nella zona sbagliata.' : 'Hai provato a tirare fuori case ancora bloccati.']
  ];
  const lavoro = voci.map((v, i) => [...v, i]).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[3] - b[3]).slice(0, 3).map(([ok, , txt]) => L(ok, txt)).join('');
  const verdict = workVerdict(E.score);
  const nOk = G.cases.filter(c => c.zone === c.def.zone && !c.rushed).length;
  const nDmg = G.cases.filter(c => stateOf(c.integrity) !== 'integro').length + parsBroken;
  const cartOk = S.cartTrips > 0 && S.cartCases >= 2 * S.cartTrips - 1;
  $('#end').innerHTML = `
    <div class="bolla">
      <header>
        <div><h2>Bolla di scarico</h2><small>Festa della scuola · I.C. Galilei · furgone</small></div>
        <span class="stamp ${late ? 'late' : 'ok'}">${late ? (reason === 'tempo' ? 'FUORI TEMPO' : 'CHIUSO A MANO') : 'IN ORARIO'}</span>
      </header>
      <div class="sum">
        <div><span>Fine scarico</span><b>${endClock}</b></div>
        <div><span>Ritardo montaggio</span><b>+${minutes} min</b></div>
        <div><span>Birre</span><b>${birre ? '🍺'.repeat(birre) : '0'}</b></div>
        <div><span>Reputazione</span><b>${rep > 0 ? '+' : ''}${rep}</b></div>
      </div>
      <div class="riep"><h3>${reason === 'tempo' ? 'SCARICO CHIUSO DI CORSA' : 'SCARICO COMPLETATO'}</h3>
        <div><span>Materiale scaricato</span><b>${nOk}/${G.cases.length}</b></div>
        <div><span>Materiale danneggiato</span><b>${nDmg}</b></div>
        <div><span>Viaggi effettuati</span><b>${S.trips}</b></div>
        <div><span>Uso del carrello</span><b>${cartOk ? 'corretto' : 'non ottimale'}</b></div>
        <div><span>Organizzazione</span><b>${workWord(E.ordine)}</b></div>
        <div><span>Efficienza</span><b>${workWord(E.score)}</b></div>
        <div class="stelle"><span>Valutazione scarico</span><b>${stars(E.score, cartOk)}</b></div>
      </div>
      <ul class="lavoro">${lavoro}</ul>
      <p class="note">${verdict}</p>
      <div class="montaggio"><b>AL MONTAGGIO</b><br>
        PAR: ${Math.min(parAvail, 4)} su 4 · Stativi: ${Math.min(staAvail, 4)} su 4 · Pezzi da sistemare: ${[...G.stowed, ...G.cases].filter(c => stateOf(c.integrity) === 'difettoso').length}
        ${spareNote.length ? '<br>Dal case ricambi: ' + spareNote.join(', ') + '.' : ''}
        ${rushed.length ? '<br>Scaricati di corsa da Macio e dal bidello: ' + rushed.map(c => c.def.name).join(', ') + '.' : ''}
        <br>${cavi}
      </div>
      <div class="tw"><table>
        <thead><tr><th>Case</th><th>Zona</th><th>Stato</th><th>Al montaggio</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">🍺 senza rotture: ${rotti === 0 ? 'sì' : 'no'} · 🍺 tutto al suo posto entro le 16:30: ${reason === 'ok' ? 'sì' : 'no'} · Reputazione: +3 se nessun danno, −2 per ogni pezzo rotto${G.kidHits ? ', −1 per ogni bambino urtato (' + G.kidHits + ')' : ''}${roughRep ? ', −' + roughRep + ' per la movimentazione brusca' : ''}.</p>
      ${EMBED ? '<p class="note">Il montaggio parte alle ' + montaggioStart(minutes) + '.</p>' : '<p class="note">Aperto da solo: il risultato non passa al gioco.</p>'}
      <div class="row"><button class="primary" id="btn-again">${EMBED ? 'Al montaggio' : 'Rigioca lo scarico'}</button></div>
    </div>`;
  $('#end').hidden = false; $('#cmd').hidden = true;
  G.result = {
    reason, endClock, minutes, beers: birre, clean: allIntegro, kidHits: G.kidHits,
    parsBroken, staBroken, ricOk,
    faulty: [...G.stowed, ...G.cases].filter(c => stateOf(c.integrity) === 'difettoso').map(c => c.def.name),
    faultyIds: [...G.stowed, ...G.cases].filter(c => stateOf(c.integrity) === 'difettoso').map(c => c.def.id),
    wrong: G.cases.filter(c => !c.rushed && c.zone !== c.def.zone).map(c => c.def.name),
    eff: E.score, rough: S.rough, trips: S.trips, cartTrips: S.cartTrips,
    // ogni case com'è arrivato: dove l'hai lasciato e in che stato. Il
    // montaggio li ritrova con lo stesso nome (vedi scaricoCase in main.js)
    cases: [...G.stowed, ...G.cases].map(ce => ({
      id: ce.def.id, name: ce.def.name, short: ce.def.short, what: ce.def.what, zone: ce.def.zone,
      at: ce.rushed || ce.stowed ? ce.def.zone : ce.zone, state: stateOf(ce.integrity), dents: Math.min(6, Math.floor((100 - ce.integrity) / 7)), rushed: !!ce.rushed
    }))
  };
  $('#btn-again').addEventListener('click', () => {
    if (EMBED) { sendResult(G.result); return; }
    $('#end').hidden = true; startGame();
  });
  AU.ding();
}

window.addEventListener('keydown', e => {
  if (e.repeat || !G) return;
  if (G.mode === 'wrap') { skipWrap(); return; }
  if (G.mode !== 'play') return;
  if (e.code === 'Digit1') selectWorker(G.player);
  if (e.code === 'Digit2') selectWorker(G.macio);
  if (e.code === 'KeyC') toggleCart();
  if (e.code === 'Escape') { if (G.sel.ce || G.sel.pickTop) cancelSel(); else togglePause(); }
  if (e.code === 'KeyP') togglePause();
});

/* la scena: un tocco (o un clic) sceglie; trascinando si guarda in giro */
(() => {
  let down = null;
  cv.addEventListener('pointerdown', e => {
    skipWrap();
    if (!G) return;
    down = { id: e.pointerId, x: e.clientX, y: e.clientY, cx: G.cam.x, cy: G.cam.y, pan: false };
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== down.id || !G) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.pan && Math.hypot(dx, dy) > 12) down.pan = true;
    if (down.pan) G.cam.manual = { x: down.cx - dx / G.cam.scale, y: down.cy - dy / G.cam.scale };
  });
  cv.addEventListener('pointerup', e => {
    if (!down || e.pointerId !== down.id) return;
    const d = down; down = null;
    if (d.pan || !G) return;
    const r = cv.getBoundingClientRect();
    tapAt(screenToWorld({ x: e.clientX - r.left, y: e.clientY - r.top }));
  });
  cv.addEventListener('pointercancel', () => { down = null; });
})();

/* la barra degli ordini: chi lavora, e per il case scelto zone e carrello */
let cmdDirty = true, cmdSig = '';
function jobWord (w) {
  if (w === G.macio && w.ai.state === 'phone') return 'al telefono';
  const j = w.job;
  if (!j && G.t - (w.failT || -9) < 3) return 'non si può: fermo';
  if (!j) return w.jobs.length ? 'ha ' + w.jobs.length + ' ordin' + (w.jobs.length > 1 ? 'i' : 'e') : 'libero';
  const more = w.jobs.length ? ' +' + w.jobs.length : '';
  if (j.kind === 'help') return 'aiuta con ' + j.ce.def.short + more;
  if (j.kind === 'van') return VAN_LABEL[j.what].toLowerCase() + more;
  if (j.kind === 'coffee') return 'caffè';
  if (j.kind === 'clear') return 'si sposta' + more;
  const why = waitWhy(w);
  if (why) return why + more;
  return (j.kind === 'cart' ? 'carrello: ' : 'porta ') + j.ce.def.short + (j.top ? '+' + j.top.def.short : '') + ' → ' + destName(j.dest) + more;
}
// perché è fermo chi ha un ordine (breve: si legge sopra la testa e sul pulsante)
function waitWhy (w) {
  if (w === G.macio && w.ai.state === 'phone') return 'al telefono';
  const j = w.job, s = j && j.steps && j.steps[j.si];
  if (!s) return null;
  if (s.laneWait) { const L = (s.lanes || []).find(x => x.who && x.who !== laneLead(w)); return L === LANES[1] ? 'aspetta la porta' : 'aspetta il furgone'; }
  if (s.k === 'reach' && s.waiting) return 'aspetta ' + (s.waitFor ? s.waitFor.def.short : 'il passaggio');
  if (s.k === 'take' && j.ce.def.heavy2 && j.ce.grabbers.length < 2) return 'aspetta il collega';
  if (s.k === 'helpWait' && s.arrived && j.lead.grab !== j.ce) return 'pronto';
  if (s.gerry) return 'fa passare Gerry';
  if (G.qte && w.grab === G.qte.ce) return null;
  if (s.hit && s.blockT > 0.4) return 'aspetta che passi';
  if (s.pause > 0) return 'ci riprova';
  return null;
}
function renderCmd () {
  const S = G.sel, play = G.mode === 'play';
  document.querySelectorAll('#cmd .who').forEach(b => {
    const w = G.workers[+b.dataset.w];
    b.classList.toggle('on', S.who === w);
    b.querySelector('i').style.background = w.tee; b.querySelector('i').style.borderColor = w.trim;
    const t = jobWord(w); if (b.querySelector('span').textContent !== t) b.querySelector('span').textContent = t;
  });
  const vp = vanPending(), ce = S.ce, t = G.trolley;
  const sig = [play, vp, G.van.anim ? 1 : 0, ce && ce.def.id, S.cart, S.top && S.top.def.id, S.pickTop, !!t, t && t.job ? 1 : 0, S.who.name, [G.player, G.macio].some(x => (x.job && x.job.kind === 'van') || x.jobs.some(q => q.kind === 'van'))].join('|');
  if (sig === cmdSig && !cmdDirty) return;
  cmdSig = sig; cmdDirty = false;
  let h = '', how = '';
  if (!play) h = '';
  else if (!ce) {
    const queued = [G.player, G.macio].some(x => (x.job && x.job.kind === 'van') || x.jobs.some(q => q.kind === 'van'));
    if (vp && !queued && !G.van.anim) h = '<button class="van" data-a="van">' + VAN_LABEL[vp] + '</button>';
    else if (!vp) h = '<span class="note">Tocca un case</span>';
  } else {
    const z = ce.def.zone;
    h = '<span class="sel"><span class="nm">' + (S.top ? ce.def.short + ' + ' + S.top.def.short : ce.def.short) + '</span><button class="x" data-a="x" aria-label="Annulla">✕</button></span>';
    if (t && canBase(ce)) how += '<button class="tog' + (S.cart ? ' on' : '') + '" data-a="cart">CARRELLO' + (S.cart ? ' ✓' : '') + '</button>';
    if (S.cart && !S.top && !ce.onTrolley && topCandidates(ce).length) how += '<button class="tog' + (S.pickTop ? ' on' : '') + '" data-a="top">+ SOPRA</button>';
    const order = [z, ...Object.keys(ZONES).filter(k => k !== z)];
    for (const k of order) h += '<button class="zone' + (k === z ? ' best' : '') + '" data-z="' + k + '" style="--zc:' + ZONES[k].color + ';color:' + (k === z ? ZONES[k].color : 'inherit') + '"><i style="background:' + ZONES[k].color + '"></i>' + ZONES[k].name.split(' ·')[0].toUpperCase() + (k === z ? '<b>✓</b>' : '') + '</button>';
  }
  $('#cmd-act').innerHTML = h;
  $('#cmd-how').innerHTML = how;
}
$('#cmd').addEventListener('click', e => {
  if (!G || G.mode !== 'play') return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.w !== undefined) { selectWorker(G.workers[+b.dataset.w]); renderCmd(); return; }
  const a = b.dataset.a;
  if (a === 'van') vanOrder();
  else if (a === 'x') cancelSel();
  else if (a === 'cart') toggleCart();
  else if (a === 'top') startPickTop();
  else if (b.dataset.z) sendTo({ zone: b.dataset.z });

});

/* ---------------------------------------------------------------------
   AVVIO E CICLO
   --------------------------------------------------------------------- */
let paused = false, lastT = 0, acc = 0, running = false;
function togglePause (force) {
  if (!G || G.mode === 'end' || $('#start').hidden === false) return;
  paused = force !== undefined ? force : !paused;
  $('#pause').hidden = !paused;
}
$('#btn-pause').addEventListener('click', () => togglePause(true));
$('#btn-resume').addEventListener('click', () => togglePause(false));
$('#btn-restart').addEventListener('click', () => { togglePause(false); startGame(); });
$('#btn-close').addEventListener('click', () => endGame('manuale'));
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.mode !== 'end') togglePause(true); });

function startGame () {
  for (const L of LANES) L.who = null;
  AU.init();
  newGame();
  $('#start').hidden = true; $('#end').hidden = true; $('#pause').hidden = true;
  $('#cmd').hidden = false; $('#keys').hidden = touchUI;
  cmdDirty = true;
  for (const id of ['#h-cart', '#h-eff-w', '#h-dmg-w']) $(id).hidden = true;
  $('#h-del-w').classList.remove('done');
  hintGoal = ''; toast('Siamo arrivati. Il furgone è chiuso.');
  paused = false; acc = 0;
  resize();
  if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(loop); }
}
function loop (now) {
  const dt = Math.min(100, now - lastT); lastT = now;
  if (!paused && G.mode !== 'end') {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 5) { stepSim(); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  render();
  hudT += dt; if (hudT > 100) { hudT = 0; updateHud(); }
  requestAnimationFrame(loop);
}

// si comanda: chi lavora, il case, la zona (il resto lo fanno loro)
$('#start-legend').innerHTML = touchUI
  ? '<span>Tocca chi lavora (Tu o Macio), poi il case e la zona dove portarlo. Trascina per guardare in giro.</span>'
  : '<span>Clic su chi lavora, sul case e sulla zona</span><span>trascina per guardare in giro</span><span><kbd>1</kbd> <kbd>2</kbd> Tu / Macio</span>';
if (touchUI) $('#app').classList.add('touch');
resize();
if (window.Matter) {
  $('#btn-start').addEventListener('click', startGame);
  // scena ferma dietro la schermata iniziale
  newGame(); G.mode = 'end'; G.doorsOpen = 0;
  (function idle () { if (running) return; render(); requestAnimationFrame(idle); })();
} else {
  $('#btn-start').hidden = true;
  if (EMBED) $('#btn-skip').hidden = false;
  const note = document.createElement('p');
  note.textContent = 'La fisica dello scarico non si è caricata (serve la connessione). ' + (EMBED ? 'Salta lo scarico per andare al montaggio.' : 'Riprova più tardi.');
  $('#btn-start').before(note);
}
